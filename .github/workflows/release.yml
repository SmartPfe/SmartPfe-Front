name: Frontend Release

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/ahmedneffati/pfeguidancefront
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_SHA }}
          build-args: |
            VITE_API_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "RELEASE_SHA='${RELEASE_SHA}' IMAGE='${IMAGE}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/apps/pfeguidance

          test -f compose.yml
          test -f .env

          echo "$GHCR_TOKEN" | sudo docker login ghcr.io \
            -u "$GHCR_USER" \
            --password-stdin

          NEW_IMAGE="${IMAGE}:${RELEASE_SHA}"
          OLD_IMAGE="$(grep '^PFEGUIDANCE_FRONTEND_IMAGE=' .env | cut -d= -f2- || true)"

          echo "Old frontend image: ${OLD_IMAGE:-none}"
          echo "New frontend image: ${NEW_IMAGE}"

          if grep -q '^PFEGUIDANCE_FRONTEND_IMAGE=' .env; then
            sed -i \
              "s|^PFEGUIDANCE_FRONTEND_IMAGE=.*|PFEGUIDANCE_FRONTEND_IMAGE=${NEW_IMAGE}|" \
              .env
          else
            printf '\nPFEGUIDANCE_FRONTEND_IMAGE=%s\n' "$NEW_IMAGE" >> .env
          fi

          rollback() {
            echo "Frontend deployment failed."

            if [ -n "${OLD_IMAGE:-}" ] && [[ "$OLD_IMAGE" != *":pending" ]]; then
              echo "Rolling back to ${OLD_IMAGE}"

              sed -i \
                "s|^PFEGUIDANCE_FRONTEND_IMAGE=.*|PFEGUIDANCE_FRONTEND_IMAGE=${OLD_IMAGE}|" \
                .env

              sudo docker compose pull frontend || true
              sudo docker compose up -d --no-deps frontend || true
            fi

            exit 1
          }

          trap rollback ERR

          sudo docker compose pull frontend
          sudo docker compose up -d --no-deps frontend

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5500/ >/dev/null; then
              echo "Frontend healthcheck passed."

              sudo docker inspect pfeguidance-frontend \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}'

              trap - ERR
              exit 0
            fi

            sleep 3
          done

          echo "Frontend healthcheck timeout."
          sudo docker logs --tail 100 pfeguidance-frontend || true
          false
          REMOTE