name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build Vite
        env:
          VITE_API_URL: /api
          VITE_GOOGLE_CLIENT_ID: dummy.apps.googleusercontent.com
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_GOOGLE_CLIENT_ID=dummy.apps.googleusercontent.com \
            -t pfeguidance-front:ci .